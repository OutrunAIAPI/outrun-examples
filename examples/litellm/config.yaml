# LiteLLM proxy config for Outrun.
#
#   pip install 'litellm[proxy]'
#   export OUTRUN_API_KEY="your-key"
#   litellm --config config.yaml
#
# Then point any OpenAI client at http://localhost:4000 and use the model_name values below.
# Add more entries with any model ID from CATALOG.md.

model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: https://api.outrun.to/v1
      api_key: os.environ/OUTRUN_API_KEY

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/claude-sonnet-5
      api_base: https://api.outrun.to/v1
      api_key: os.environ/OUTRUN_API_KEY

  - model_name: gemini-3.8-flash
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: https://api.outrun.to/v1
      api_key: os.environ/OUTRUN_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://api.outrun.to/v1
      api_key: os.environ/OUTRUN_API_KEY

  - model_name: glm-5.3-abliterated
    litellm_params:
      model: openai/glm-5.3-abliterated
      api_base: https://api.outrun.to/v1
      api_key: os.environ/OUTRUN_API_KEY

litellm_settings:
  num_retries: 0  # requests are billed; don't retry automatically
